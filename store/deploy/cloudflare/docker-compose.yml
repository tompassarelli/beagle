# Beagle Store server + auth shim for Cloudflare Workers clients.
# Run from THIS directory (the shim build context points at the repo root ../..):
#   export BEAGLE_STORE_SERVER_IMAGE="$(./build-native-image.sh)"
#   SHIM_TOKEN=$(openssl rand -hex 32) docker compose up -d --build
#
# Topology: the Worker fetches the shim (bearer token, HTTP); the shim speaks
# Store RPC v2 to the Beagle Store server over the private network.
# The Beagle Store server's port 7977 is NEVER published — the wire protocol is
# unauthenticated by design and must stay behind the shim.
services:
  server:
    # Content-addressed by its native artifact: compose consumes a tag, never builds one.
    image: ${BEAGLE_STORE_SERVER_IMAGE:?set BEAGLE_STORE_SERVER_IMAGE from ./build-native-image.sh}
    volumes:
      - store-data:/data              # the durable fact log survives restarts
    networks: [storenet]
    restart: unless-stopped
    environment:
      BEAGLE_STORE_SPACE_ID: ${BEAGLE_STORE_SPACE_ID:-cloudflare}
    # no ports: — private network only

  shim:
    build:
      context: ../..
      dockerfile: deploy/cloudflare/Dockerfile.shim
    environment:
      BEAGLE_STORE_SERVER_CONNECT: server
      BEAGLE_STORE_SERVER_PORT: "7977"
      SHIM_PORT: "8787"
      SHIM_TOKEN: ${SHIM_TOKEN:?set SHIM_TOKEN (e.g. openssl rand -hex 32)}
      BEAGLE_STORE_SPACE_ID: ${BEAGLE_STORE_SPACE_ID:-cloudflare}
    ports:
      - "8080:8787"                  # the ONE public ingress; front with TLS in prod
    networks: [storenet]
    depends_on:
      - server
    restart: unless-stopped

networks:
  storenet: {}                        # private bridge network

volumes:
  store-data: {}
