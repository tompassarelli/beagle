# stunnel — mTLS sidecar for the Beagle Store server over an untrusted link.
# ============================================================================
# The Beagle Store server wire protocol is UNAUTHENTICATED and (on babashka) cannot
# terminate TLS itself — babashka's native image has no server-side
# SSLServerSocket. So to expose a Beagle Store server across an untrusted network,
# wrap it in stunnel: the Beagle Store server keeps binding LOOPBACK (BEAGLE_STORE_BIND unset),
# and stunnel provides the mutually-authenticated TLS transport. The EDN wire
# Store RPC protocol is byte-identical inside the tunnel, so this needs ZERO Beagle Store changes.
#
#   gateway host ──TLS(mTLS)──▶ stunnel(Beagle Store server host) ──loopback plaintext──▶ Beagle Store server
#
# Generate certs with keytool/openssl: a CA, a Beagle Store server cert, and a
# gateway client cert; put the peer's CA in each `CAfile`. Never publish 7901
# beyond the gateway's network path.
# ============================================================================

# ---- ON THE Beagle Store SERVER HOST (TLS server; requires + verifies the client) ----
# Run the Beagle Store server on loopback (default): bin/beagle-store-server 7977
# Then stunnel terminates TLS on :7901 and forwards to the loopback server.
[beagle-store-server]
accept  = 0.0.0.0:7901
connect = 127.0.0.1:7977
cert    = /etc/store/tls/server.crt
key     = /etc/store/tls/server.key
CAfile  = /etc/store/tls/client-ca.crt
verify  = 2            ; require + verify the client cert chain to CAfile (mTLS)
sslVersion = TLSv1.3

# ---- ON THE GATEWAY HOST (TLS client; presents the gateway cert) -------------
# The gateway connects PLAINTEXT to 127.0.0.1:7902; stunnel TLS-connects out to
# the Beagle Store server host presenting the gateway client cert. Point the gateway's
# tenant registry :server-host/:server-port at 127.0.0.1:7902.
#
# [beagle-store-server-client]
# client  = yes
# accept  = 127.0.0.1:7902
# connect = server-host.private:7901
# cert    = /etc/store/tls/gateway.crt
# key     = /etc/store/tls/gateway.key
# CAfile  = /etc/store/tls/server-ca.crt
# verify  = 2
# sslVersion = TLSv1.3
