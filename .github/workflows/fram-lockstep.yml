name: fram lockstep

# Release and certification workflows consume `native-core/validation/fram.ref`.
# This scheduled lane follows Fram main and exercises the same current surface.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: fram-lockstep
  cancel-in-progress: true

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Link beagle packages
        run: |
          raco pkg install --auto --link \
            beagle-lib/ beagle-test/ beagle/

      - name: Install babashka
        uses: turtlequeue/setup-babashka@v1.8.0
        with:
          babashka-version: '1.12.218'

      - name: Checkout moving Fram main
        uses: actions/checkout@v5
        with:
          repository: tompassarelli/fram
          path: .fram

      - name: Run Beagle-Fram current gates
        env:
          FRAM_OUT: ${{ github.workspace }}/.fram/out
          CHARTROOM: ${{ github.workspace }}/.fram/chartroom
          CODE_AS_FACTS_CORPUS: ${{ github.workspace }}/.fram/src
        run: |
          bin/test/cascade-graph/run.sh
          bin/test/callgraph-xmodule/run.sh
          bin/test/code-as-facts/run.sh
          bin/test/code-as-facts/rename.sh
          bin/test/code-as-facts/delete.sh
          bin/test/code-as-facts/authoring.sh
          bin/test/code-as-facts/authoring-verbs.sh
          bin/test/engine-demo/run.sh
