name: fram lockstep

# Release and certification workflows consume one immutable Fram revision.
# This lane deliberately follows Fram main so forward compatibility drift is
# visible without making Beagle releases depend on a repository that can
# change between retries. The code-as-facts rename gate selects Fram's current
# `.bgl` owner; release CI independently keeps the immutable compatibility owner.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: fram-lockstep
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Link beagle packages
        run: |
          raco pkg install --auto --link \
            beagle-lib/ beagle-test/ beagle/

      - name: Install babashka
        uses: turtlequeue/setup-babashka@v1.8.0
        with:
          babashka-version: '1.12.218'

      - name: Checkout moving Fram main
        uses: actions/checkout@v5
        with:
          repository: tompassarelli/fram
          path: .fram

      - name: Run Beagle-Fram compatibility gates
        env:
          FRAM_OUT: ${{ github.workspace }}/.fram/out
          CHARTROOM: ${{ github.workspace }}/.fram/chartroom
          CODE_AS_FACTS_CORPUS: ${{ github.workspace }}/.fram/src
        run: |
          bin/test/cascade-graph/run.sh
          bin/test/callgraph-xmodule/run.sh
          bin/test/code-as-facts/run.sh
          # Moving Fram owns the complete rename capability suite. Immutable-pin
          # CI runs only its explicit legacy authority boundary.
          bin/test/code-as-facts/rename.sh
          bin/test/code-as-facts/delete.sh
          bin/test/code-as-facts/authoring.sh
          bin/test/code-as-facts/authoring-verbs.sh
          bin/test/engine-demo/run.sh
