# Requires tier-runner --full/--shard support from the gate-shard lane; the two
# land together.
name: tests

# Suite shards and pre-gates remain blocking. The newly exposed gate groups run
# concurrently and remain visible under the explicit quarantine below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Self-host bootstrap fixpoint: the seed .clj under self-host/seed/ IS the
  # compiler babashka runs; reminting the compiler's own sources with it must
  # reproduce the seed byte-for-byte (emission is deterministic — that is what
  # makes the seed CI-enforceable). Any byte divergence between
  # self-host/src/ and the blessed seed fails here. bb-only, so it gates fast
  # and independently of the Racket toolchain; the three-way check with the
  # Racket oracle runs inside the main test job below.
  selfhost-remint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install babashka (pinned)
        uses: turtlequeue/setup-babashka@v1.8.0
        with:
          babashka-version: '1.12.218'

      - name: Remint fixpoint gate
        run: bin/beagle-remint

  pre-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Restore Racket compilation layer
        uses: actions/cache@v5
        with:
          path: |
            **/compiled
          key: racket-compiled-v2-9.1-${{ hashFiles('**/*.rkt') }}
          restore-keys: |
            racket-compiled-v2-9.1-

      - name: Link beagle packages
        run: |
          raco pkg install --auto --link \
            beagle-lib/ beagle-test/ beagle/

      # The scope gate was formerly reached through `direnv exec`, which gave
      # _beagle-racket an explicit pinned executable. This standalone job uses
      # setup-racket's matching 9.1 installation, so publish that same identity
      # for the gate's nested checkout probes.
      - name: Select installed Racket for Beagle tooling
        run: printf '_BEAGLE_RACKET=%s\n' "$(command -v racket)" >> "$GITHUB_ENV"

      - name: Racket scope gate
        run: bin/test/racket-scope/run.sh

      - name: Checkout-first gate
        run: bin/test/checkout-first/run.sh

  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Restore Racket compilation layer
        uses: actions/cache@v5
        with:
          path: |
            **/compiled
          key: racket-compiled-v2-9.1-${{ hashFiles('**/*.rkt') }}
          restore-keys: |
            racket-compiled-v2-9.1-

      - name: Link beagle packages
        run: |
          raco pkg install --auto --link \
            beagle-lib/ beagle-test/ beagle/

      # The suite's Clojure oracle resolves bb from the flake; this explicit
      # install keeps the standalone executable available to suite tooling.
      - name: Install babashka (CLJ oracle + graph-native repair tooling)
        uses: turtlequeue/setup-babashka@v1.8.0
        with:
          babashka-version: '1.12.218'

      - name: Install nix (pinned Beagle test environment)
        uses: cachix/install-nix-action@v31

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 7G

      - name: Install direnv from the flake's nixpkgs input
        run: nix profile install --inputs-from . nixpkgs#direnv

      # Bounded-check contract: shared CI runners receive a 3x case-deadline
      # scale; each check remains supervised by its existing explicit deadline.
      - name: Run tiered test suite
        env:
          BEAGLE_DEADLINE_SCALE: '3'
        run: |
          echo "nproc=$(nproc)"
          direnv allow .
          direnv exec . racket beagle-lib/private/tier-runner.rkt --full --shard ${{ matrix.shard }}/4

  gates-standalone:
    # QUARANTINE (EXEC-55): first-ever executions expose pre-existing gate
    # failures; non-blocking pending the gate-repair program; every failure
    # still visible in the run summary.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Restore Racket compilation layer
        uses: actions/cache@v5
        with:
          path: |
            **/compiled
          key: racket-compiled-v2-9.1-${{ hashFiles('**/*.rkt') }}
          restore-keys: |
            racket-compiled-v2-9.1-

      - name: Link beagle packages
        run: |
          raco pkg install --auto --link \
            beagle-lib/ beagle-test/ beagle/

      - name: Install babashka (CLJ oracle + graph-native repair tooling)
        uses: turtlequeue/setup-babashka@v1.8.0
        with:
          babashka-version: '1.12.218'

      # Self-host three-way agreement: the blessed seed (self-host/seed/), the
      # seed compiler's remint of its own sources, and the Racket oracle's
      # emission of the same sources must all be byte-identical. The bb-only
      # fixpoint also runs standalone in the selfhost-remint job; this adds the
      # Racket side (racket + bb are both built/installed above).
      - name: Self-host remint — three-way oracle agreement
        run: _BEAGLE_RACKET="$(which racket)" bin/beagle-remint --oracle

      # Byte-stable emit (move 2): the facts->source pretty-printer must be a
      # deterministic, LOCAL, comment-preserving, round-trip-preserving formatter —
      # the precondition for making facts canonical and text a regenerable lowering.
      # Racket-only (no fram/bb), so it runs right after the suite.
      - name: Byte-stable emit — fixed-point + locality + comments gate
        run: bin/test/byte-stable-emit/run.sh

      # Build reproducibility: the same source compiles BYTE-IDENTICALLY every build.
      # match's temp was (random ...) -> non-reproducible; now a deterministic counter.
      - name: Build reproducibility — deterministic match temps
        run: bin/test/build-reproducible/run.sh

      # Repair pipeline: beagle-repair consumes blame.rkt's semantic suspicions as
      # STRUCTURED records, not by regex-scraping the prose SUSPECT line. Gates that
      # a suspicion on a validly-named function the prose regex can't parse (e.g.
      # `total=`) survives. (Needs racket + bb, both above; no fram.)
      - name: Repair pipeline — structured semantic suspicions gate
        run: bin/test/repair-semantic/run.sh

      - name: Show accumulated surface debt
        if: always()
        run: |
          if [ -f lab/surface-debt.md ]; then
            head -20 lab/surface-debt.md
          fi

  gates-fram:
    # QUARANTINE (EXEC-55): first-ever executions expose pre-existing gate
    # failures; non-blocking pending the gate-repair program; every failure
    # still visible in the run summary.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Restore Racket compilation layer
        uses: actions/cache@v5
        with:
          path: |
            **/compiled
          key: racket-compiled-v2-9.1-${{ hashFiles('**/*.rkt') }}
          restore-keys: |
            racket-compiled-v2-9.1-

      - name: Link beagle packages
        run: |
          raco pkg install --auto --link \
            beagle-lib/ beagle-test/ beagle/

      - name: Install babashka (CLJ oracle + graph-native repair tooling)
        uses: turtlequeue/setup-babashka@v1.8.0
        with:
          babashka-version: '1.12.218'

      # Graph-native repair: beagle-cascade derives its call graph from the Fram
      # occurrence store (scope-correct), not regex over text. That runs on the Fram
      # engine, so we check out fram's committed classpath and gate the
      # scope-correctness proof (a change to mod_a/helper must NOT blast mod_b's
      # same-named helper). This is the load-bearing test for the thesis that
      # graph-backed repair beats text-backed repair. (babashka installed above.)
      - name: Load current Fram revision
        id: fram-revision
        run: |
          revision="$(tr -d '\r\n' < native-core/validation/fram.ref)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid Fram revision: $revision" >&2
            exit 1
          fi
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout fram (the fact engine cascade runs on)
        uses: actions/checkout@v5
        with:
          repository: tompassarelli/fram
          path: .fram
          ref: ${{ steps.fram-revision.outputs.revision }}

      # beagle-callgraph RENTS the scope-correct call-graph engine (resolve.clj),
      # which was FOLDED into the fram repo at fram/chartroom (beagle source
      # code-intelligence, renting fram's public fact+Datalog API). No separate
      # chartroom checkout — it ships inside the fram checkout, so CHARTROOM points
      # at .fram/chartroom. (The fold is licensed by lockstep cadence + this very
      # friction relief; fram's core_code_blind_test guards the seam stays clean.)
      - name: Graph-native cascade — scope-correctness gate
        run: FRAM_OUT="$GITHUB_WORKSPACE/.fram/out" CHARTROOM="$GITHUB_WORKSPACE/.fram/chartroom" bin/test/cascade-graph/run.sh

      # Reasoning call-graph cross-module completeness: the call graph is derived from the
      # converged resolver (refers_to), so qualified cross-module calls (a/f, m/f) resolve
      # and the blast radius is NOT silently emptied. Guards the dangerous "0 callers" lie.
      - name: Reasoning call-graph — cross-module completeness gate
        run: FRAM_OUT="$GITHUB_WORKSPACE/.fram/out" CHARTROOM="$GITHUB_WORKSPACE/.fram/chartroom" bin/test/callgraph-xmodule/run.sh

      # Move 3: code can be fact-canonical. The loop .bclj -> lossless facts ->
      # (through a real Fram store) -> facts -> byte-stable .bclj is datum-identical
      # through the engine AND recompiles to the IDENTICAL program (modulo srcloc
      # debug pointers). Proven over fram/src. Needs racket + bb + fram's out/.
      - name: Code as canonical facts — recompile-identity gate
        run: CODE_AS_FACTS_CORPUS="$GITHUB_WORKSPACE/.fram/src" FRAM_OUT="$GITHUB_WORKSPACE/.fram/out" bin/test/code-as-facts/run.sh

      - name: Fram scope-correct rename
        run: FRAM_OUT="$GITHUB_WORKSPACE/.fram/out" CHARTROOM="$GITHUB_WORKSPACE/.fram/chartroom" CODE_AS_FACTS_CORPUS="$GITHUB_WORKSPACE/.fram/src" bin/test/code-as-facts/rename.sh

      # Delete as a graph op: the no-orphaned-references invariant. A safe delete omits
      # the form + its subtree and renumbers siblings (no truncation); a delete that
      # would orphan a reference (this module or a consumer) is refused, fail-closed.
      - name: Delete as a graph op — no-orphaned-references invariant
        run: FRAM_OUT="$GITHUB_WORKSPACE/.fram/out" CHARTROOM="$GITHUB_WORKSPACE/.fram/chartroom" bin/test/code-as-facts/delete.sh

      # NL -> edit authoring layer: prose intent -> a structured edit (data an agent
      # emits) -> the engine (rename/delete) -> recompile-gated commit, else fail closed.
      - name: NL-to-edit authoring layer — recompile-gated transaction
        run: FRAM_OUT="$GITHUB_WORKSPACE/.fram/out" CHARTROOM="$GITHUB_WORKSPACE/.fram/chartroom" bin/test/code-as-facts/authoring.sh

      # Graph-native AUTHORING (the dogfood at the root): upsert-form (add/replace a def)
      # and set-body are FACT operations on the AST-facts, not text patches — scope-correct
      # by identity (an authored ref resolves through refers_to), recompile-gated, fail-closed.
      - name: Authoring-as-facts — upsert-form + set-body verbs
        run: FRAM_OUT="$GITHUB_WORKSPACE/.fram/out" CHARTROOM="$GITHUB_WORKSPACE/.fram/chartroom" bin/test/code-as-facts/authoring-verbs.sh

      # One engine, both pillars, on REAL code: the blast radius (REASON) of fram.store/value!
      # predicts the cross-module reach of renaming it (REPAIR), and the repaired tree
      # recompiles — both derived from the same converged refers_to resolver.
      - name: Engine demo — reason + repair consistent on real fram/src
        run: FRAM_OUT="$GITHUB_WORKSPACE/.fram/out" CHARTROOM="$GITHUB_WORKSPACE/.fram/chartroom" CODE_AS_FACTS_CORPUS="$GITHUB_WORKSPACE/.fram/src" bin/test/engine-demo/run.sh
